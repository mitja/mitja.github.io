# -- Main Menu --
# The blog first: the home page is its stream. Blog, Training and Apps carry
# params.tab = true and also form the tab bar under the header on small screens
# (layouts/partials/header/tabs.html), so desktop and phone show the same three
# sections. The identifiers blog/training/apps mark the current tab.

[[main]]
  identifier = "blog"
  name = "Blog"
  pageRef = "/"
  weight = 10
  [main.params]
    tab = true

[[main]]
  identifier = "training"
  name = "Training"
  pageRef = "training"
  weight = 20
  [main.params]
    tab = true

[[main]]
  identifier = "apps"
  name = "Apps"
  pageRef = "apps"
  weight = 30
  [main.params]
    tab = true

[[main]]
  identifier = "about"
  name = "About"
  pageRef = "about"
  weight = 40

[[main]]
  identifier = "mail"
  pre = "email"
  url = "mailto:hi@mitjamartini.com"
  weight = 50

# -- Footer Menu --

[[footer]]
  name = "Imprint"
  pageRef = "imprint"
  weight = 10

[[footer]]
  name = "Privacy"
  pageRef = "privacy"
  weight = 20
