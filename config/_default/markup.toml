# -- Markup --
# These settings are required for the theme to function.

[goldmark]
[goldmark.renderer]
  unsafe = true

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4

# ==text== renders as <mark>, which the paasbox theme draws as a yellow marker.
[goldmark.extensions.extras.mark]
  enable = true
