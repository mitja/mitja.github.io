# -- Main Menu --
# The blog first: the home page is its stream. Blog, Trainings and Apps carry
# params.tab = true and also form the tab bar under the header on small screens
# (layouts/partials/header/tabs.html), so desktop and phone show the same three
# sections. The identifiers blog/training/apps mark the current tab.

[[main]]
  identifier = "blog"
  name = "Blog"
  pageRef = "/"
  weight = 10
  [main.params]
    tab = true

[[main]]
  identifier = "training"
  name = "Trainings"
  pageRef = "training"
  weight = 20
  [main.params]
    tab = true

[[main]]
  identifier = "portal"
  name = "Kursportal"
  url = "https://training.mitjamartini.com/"
  weight = 25
  [main.params]
    target = "_blank"

[[main]]
  identifier = "apps"
  name = "Apps"
  pageRef = "apps"
  weight = 30
  [main.params]
    tab = true

[[main]]
  identifier = "about"
  name = "Über mich"
  pageRef = "about"
  weight = 40

[[main]]
  identifier = "mail"
  pre = "email"
  url = "mailto:hi@mitjamartini.com"
  weight = 50

# -- Footer Menu --

[[footer]]
  name = "Impressum"
  pageRef = "imprint"
  weight = 10

[[footer]]
  name = "Datenschutz"
  pageRef = "privacy"
  weight = 20
