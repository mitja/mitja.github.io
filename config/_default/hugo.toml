# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/getting-started/

theme = ["paasbox", "blowfish"] # paasbox is a component: its files win, Blowfish supplies the rest
baseURL = "https://mitjamartini.com/"
# "en" stays the default content language: files without a language suffix (index.md) are English.
# Both languages live in subdirectories (/de/, /en/); the root / is a language chooser that prefers German.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
# The root / is a tiny language chooser (static/index.html), not Hugo's redirect to the default language.
disableDefaultLanguageRedirect = true

enableRobotsTXT = true
pagination.pagerSize = 20
summaryLength = 1000

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-MJ6W78NM6R"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
